<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auto Hide Sidebar</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* Sidebar container */
    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
        width: 220px;
        background-color: #1f2937;
        transform: translateX(-180px);  /* Hide most of sidebar */
        transition: transform 0.3s ease;
        z-index: 1000;
    }

    /* When mouse moves over sidebar area */
    .sidebar:hover {
        transform: translateX(0);
    }

    /* Optional: small visible strip */
    .sidebar::after {
        content: "";
        position: absolute;
        right: -10px;
        top: 0;
        width: 10px;
        height: 100%;
        background-color: #2563eb;
        cursor: pointer;
    }

    /* Content area */
    .content {
        margin-left: 40px; /* space for visible strip */
        flex: 1;
        width: 100%;
    }

    iframe {
        border: none;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>

<div class="sidebar">
    <iframe src="navbar.html"></iframe>
</div>

<div class="content">
    <iframe name="contentFrame" src="home.html"></iframe>
</div>

</body>
</html>
