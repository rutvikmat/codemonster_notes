<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Assignment Operators</title>
</head>
<body>

<h2>Arithmetic Assignment Operators in JavaScript</h2>

<script>

let x = 10;

document.write("Initial value of x = " + x + "<br><br>");

x += 5;
document.write("After x += 5 → " + x + "<br>");


x -= 3;
document.write("After x -= 3 → " + x + "<br>");


x *= 2;
document.write("After x *= 2 → " + x + "<br>");

x /= 4;
document.write("After x /= 4 → " + x + "<br>");

x %= 3;
document.write("After x %= 3 → " + x + "<br>");


x **= 2;
document.write("After x **= 2 → " + x + "<br>");

</script>

</body>
</html>
