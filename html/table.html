<!DOCTYPE html>
<html>
<head>
<title>table</title>

<style>
    img {
        float: left;
        margin-right: 20px;
    }

    table {
        border-collapse: collapse;
        width: 50%;
        clear: left;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: #f2f2f2;
    }
</style>
</head>
<body>

<section>
    <p>
        <img src="/Users/rutvikmathapati/Downloads/wall.png" 
             alt="example image" 
             width="300" height="300">
        This is a floated image example. Text wraps around the image.
    </p>
</section>

<section>
    <center>
    <table border-spacing="5" border="2">
        <caption>Student Information</caption>
        <thead>
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Mobile</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>20</td>
            <td>55512345</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>22</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Emily Johnson</td>
            <td>19</td>
        </tr>
        </tbody>
    </table>
    </center>
</section>
<section>
    <table style="width:100%">
  <tr>
    <th>Name</th>
    <th colspan="2">Telephone</th>
  </tr>
  <tr>
    <td>Bill Gates</td>
    <td>55577854</td>
    <td>55577855</td>
  </tr>
</table>
</section>
<section>
<table style="width:100%">
  <tr>
    <th>Name:</th>
    <td>Bill Gates</td>
  </tr>
  <tr>
    <th rowspan="3">Telephone:</th>
    <td>55577854</td>
  </tr>
  <tr>
    <td>55577855</td>
  </tr>
  <tr>
    <td>545454545</td>
  </tr>
</table>
</section>

</body>
</html>
