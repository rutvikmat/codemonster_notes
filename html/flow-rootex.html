<!DOCTYPE html>
<html>
<head>
<title>Flow Root Example</title>
<style>

.container {
  display: flow-root;
  border: 2px solid black;
  padding: 10px;
}

.box {
  float: left;
  width: 100px;
  height: 100px;
  background: orange;
  margin-right: 10px;
}

</style>
</head>
<body>

<h2>Display: flow-root</h2>

<div class="container">
  <div class="box"></div>
  Some text beside the floated box.
</div>

</body>
</html>
