<!DOCTYPE html>
<html lang="en">
    <head>
        <title>JavaScript Example</title>
    </head>
    <body>
        <h1> Codemonsters </h1>
        <script>
            var a=prompt("Enter value of a:");
            var b=prompt("Enter value of b:");
            var a1=parseInt(a);
            var b1=parseInt(b);
            result = a1 + b1;
            document.write("The sum of a and b is: " + result + "<br>");
        </script>
    </body>
</html>
