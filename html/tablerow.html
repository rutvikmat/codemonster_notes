<!DOCTYPE html>
<html>
<head>
<title>CSS Table Row Example</title>
<style>

.table {
  display: table;
  width: 60%;
  border-collapse: collapse;
  margin: 20px auto;
}

.row {
  display: table-row;
}

.cell {
  display: table-cell;
  border: 1px solid black;
  padding: 10px;
  text-align: center;
}

.header {
  font-weight: bold;
  background-color: lightgray;
}

</style>
</head>
<body>

<div class="table">

  <div class="row header">
    <div class="cell">Name</div>
    <div class="cell">Age</div>
    <div class="cell">City</div>
  </div>

  <div class="row">
    <div class="cell">Pavitra</div>
    <div class="cell">35</div>
    <div class="cell">Bangalore</div>
  </div>

  <div class="row">
    <div class="cell">Avanija</div>
    <div class="cell">10</div>
    <div class="cell">Bangalore</div>
  </div>

</div>

</body>
</html>
