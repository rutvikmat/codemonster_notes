<!DOCTYPE html>
<html>
<head>
<title>List Item Example</title>
<style>

.item {
  display: list-item;
  list-style-type: disc;   /* Bullet type */
  margin-left: 40px;       /* Space for bullet */
  padding: 5px;
  font-size: 18px;
}

</style>
</head>
<body>

<h2>Subjects</h2>

<div class="item">HTML</div>
<div class="item">CSS</div>
<div class="item">JavaScript</div>

</body>
</html>
