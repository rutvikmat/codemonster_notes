<!DOCTYPE html>
<html>
<head>
<title>Table Cell Example</title>
<style>

.container {
  display: table;
  width: 400px;
  height: 200px;
  border: 2px solid black;
  margin: 30px auto;
}

.cell {
  display: table-cell;
  border: 1px solid blue;
  text-align: center;        /* Horizontal center */
  vertical-align: middle;    /* Vertical center */
  font-size: 20px;
  background-color: lightyellow;
}

</style>
</head>
<body>

<div class="container">
  <div class="cell">
    Centered Content
  </div>
</div>

</body>
</html>
