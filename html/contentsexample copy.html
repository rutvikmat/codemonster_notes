<!DOCTYPE html>
<html>
<head>
<title>Display Contents Example</title>
<style>

.container {
  display: contents;
}

.box {
  background: lightblue;
  padding: 20px;
  margin: 10px;
  border: 1px solid black;
}

</style>
</head>
<body>

<h2>Display: contents</h2>

<div class="container">
  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
</div>

</body>
</html>
