<!Doctype html>
<html>
<head>
<style>
.grid-box {
  display: inline-grid;
  grid-template-columns: auto auto;
  gap: 5px;
  background: yellow;
}</style>
</head>
<body>
<span class="grid-box">
  <span>A</span>
  <span>B</span>
<span>C</span>
  <span>D</span>
</span>
</body>
</html>
