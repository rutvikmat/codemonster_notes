<!Doctype html>
<html>
<head>
<style>
.table { display: table; }
.row { display: table-row; }
.cell {
  display: table-cell;
  border: 1px solid black;
  padding: 10px;
}</style>
</head>
<body>
<div class="table">
  <div class="row">
    <div class="cell">A</div>
    <div class="cell">B</div>
  </div>
</div></body>
</html>
