<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry & Thank You</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            background: linear-gradient(to right, #f8d7da, #d1e7dd);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .card-box {
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .emoji {
            font-size: 60px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-10 col-md-8 col-lg-6">

            <div class="card-box">

                <!-- Sorry Section -->
                <div class="mb-4">
                    <div class="emoji">🙏</div>
                    <h2 class="text-danger">I’m Sorry Madhu</h2>
                    <p class="text-muted">
                        I sincerely apologize if my actions or words caused any trouble.
                        It was never my intention to hurt you.
                    </p>
                </div>

                <hr>

                <!-- Gratitude Section -->
                <div class="mt-4">
                    <div class="emoji">💖</div>
                    <h2 class="text-success">Thank You</h2>
                    <p class="text-muted">
                        Thank you for your patience, understanding, and kindness.
                        I truly appreciate you.
                    </p>
                </div>

                <!-- Buttons -->
                <div class="mt-4 d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <button class="btn btn-danger px-4">Accept Apology</button>
                    <button class="btn btn-success px-4">You’re Welcome</button>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
