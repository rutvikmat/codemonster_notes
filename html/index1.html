<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Student Registration</title>
   

    <!-- CSS Link -->
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="container">

    <form class="registration-form">

        <h2>Student Registration</h2>
        <p class="subtitle">Please fill in the details below</p>

        <!-- Full Name -->
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name" required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password" required>
        </div>

        <!-- Mobile -->
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label>Gender</label>
            <div class="inline-group">
                <label><input type="radio" name="gender" required> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>
        </div>

        <!-- DOB -->
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" required>
        </div>

        <!-- Course -->
        <div class="form-group">
            <label>Course</label>
            <select required>
                <option value="">Select Course</option>
                <option>MCA</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>M.Tech</option>
                <option>B.Sc</option>
                <option>M.Sc</option>
            </select>
        </div>

       <!-- Skills -->
<div class="form-group skills-group">
    <label class="center-label">Skills</label>

    <div class="skills-container">

        <label class="skill-item">
            <input type="checkbox">
            <span>HTML</span>
        </label>

        <label class="skill-item">
            <input type="checkbox">
            <span>CSS</span>
        </label>

        <label class="skill-item">
            <input type="checkbox">
            <span>JavaScript</span>
        </label>

        <label class="skill-item">
            <input type="checkbox">
            <span>Python</span>
        </label>

    </div>
</div>

        <!-- Address -->
        <div class="form-group">
            <label>Address</label>
            <textarea rows="3" placeholder="Enter your address" required></textarea>
        </div>

        <!-- File Upload -->
        <div class="form-group">
            <label>Upload Photo</label>
            <input type="file" required>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button type="submit" class="btn submit-btn">Register</button>
            <button type="reset" class="btn reset-btn">Reset</button>
        </div>

    </form>

</div>

</body>
</html>
