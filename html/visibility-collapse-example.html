<!DOCTYPE html>
<html>
<head>
<style>

table {
  border-collapse: collapse;
  width: 50%;
}

td, th {
  border: 1px solid black;
  padding: 10px;
  text-align: center;
}

.hide-row {
  //visibility: collapse;
}

</style>
</head>
<body>

<table>
  <tr>
    <th>Name</th>
    <th>Age</th>
  </tr>
  <tr class="hide-row">
    <td>Pavitra</td>
    <td>35</td>
  </tr>
  <tr>
    <td>Avanija</td>
    <td>10</td>
  </tr>
</table>

</body>
</html>
