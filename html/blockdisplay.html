<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example of CSS display</title>
  <style>
    span {
       display: block;
        background: #F0E68C;
    }
    div {
       display: inline;
        background: #90EE90;
    }
  </style>
</head>
<body>
  <p>
	<div>
    <a href="https://www.xyz.com/" target="_top">Visit xyz.com</a>
	</div>
	<div>
<a href="https://www.xyz.com/" target="_top">Visit xyz.com</a>
  </div>
    <span>This span element generates a block box.</span>
 <span>This is second span element generates a block box.</span>

  </p>
</body>
</html>
