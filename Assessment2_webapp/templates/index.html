<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Video Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
    }

    .container {
      width: 100%;
      max-width: 760px;
      padding: 28px;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .title {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.8rem;
      color: #cbd5f5;
      margin-bottom: 6px;
    }

    input, textarea, select {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
      color: #e5e7eb;
      outline: none;
      font-size: 0.9rem;
      transition: border 0.15s ease, box-shadow 0.15s ease;
    }

    textarea { resize: vertical; min-height: 100px; }

    input:focus, textarea:focus, select:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
    }

    .full { grid-column: span 2; }

    .actions {
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    button {
      flex: 1;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.05s ease, opacity 0.1s ease;
    }

    button:hover {
      box-shadow: 0 8px 25px rgba(79,70,229,0.45);
      opacity: 0.95;
    }

    button:active {
      transform: translateY(1px);
    }

    .loader {
      display: none;
      margin-top: 14px;
      font-size: 0.85rem;
      color: #a5b4fc;
      text-align: center;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .footer {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: span 1; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <div class="header">
        <div>
          <div class="title">AI Explainer Video Generator</div>
          <div class="subtitle">Create professional videos from text in seconds</div>
        </div>
      </div>

      <form method="POST" onsubmit="showLoader()">

        <div class="grid">

          <div class="field full">
            <label>Title</label>
            <input name="title" placeholder="Python Workshop" required>
          </div>

          <div class="field">
            <label>Date</label>
            <input name="date" placeholder="12 Oct 2025" required>
          </div>

          <div class="field">
            <label>Duration</label>
            <input name="duration" placeholder="45 minutes" required>
          </div>

          <div class="field full">
            <label>Bullet Points (one per line)</label>
            <textarea name="points" placeholder="Introduction to Python&#10;Hands-on coding&#10;Certificate provided" required></textarea>
          </div>

          <div class="field full">
            <label>Visual Theme</label>
            <select name="template">
              <option value="dark">Dark Corporate</option>
              <option value="light">Light Minimal</option>
            </select>
          </div>

        </div>

        <div class="actions">
          <button type="submit">Generate Video</button>
        </div>

        <div id="loader" class="loader">
          Rendering video... this may take 30–60 seconds ⏳
        </div>

      </form>

      <div class="footer">
        Powered by Python • MoviePy • Flask
      </div>

    </div>
  </div>

<script>
function showLoader(){
  document.getElementById("loader").style.display = "block";
}
</script>

</body>
</html>
