Discount Eligibility
<!DOCTYPE html>
<html>
<head>
  <title>Discount Eligibility</title>
</head>
<body>
<script>
  let amount = parseFloat(prompt("Enter purchase amount:"));

  if (amount > 100) {
    document.write("Discount Applied");
  } else {
    document.write("No Discount");
  }
</script>
</body>
</html>
