<!doctype html>
<head>
    <title>Addition Function Example</title>
</head>
<body>
    <script>
        function addNumber() {
            let a=10;
            let b=20;
            document.write("The sum is: " + (a + b));
        }
    </script>
    <button onclick="addNumber()">Click Here</button>
</body>
</html>
