<!DOCTYPE html>
<head>
    <title>Day 3</title>
</head>
<body>
<script type="text/javascript">
    document.write("1 - Add<br/>2 - Sub<br/>3 - Mul<br/>4 - Div<br/>");

    var option = parseInt(prompt("Enter your option:"));

    var n1, n2;

    switch(option){
        case 1:
            n1 = parseInt(prompt("Enter first number:"));
            n2 = parseInt(prompt("Enter second number:"));
            alert("Addition is: " + (n1 + n2));
            break;

        case 2:
            n1 = parseInt(prompt("Enter first number:"));
            n2 = parseInt(prompt("Enter second number:"));
            alert("Subtraction is: " + (n1 - n2));
            break;

        case 3:
            n1 = parseInt(prompt("Enter first number:"));
            n2 = parseInt(prompt("Enter second number:"));
            alert("Multiplication is: " + (n1 * n2));
            break;

        case 4:
            n1 = parseInt(prompt("Enter first number:"));
            n2 = parseInt(prompt("Enter second number:"));
            alert("Division is: " + (n1 / n2));
            break;

        default:
            alert("Invalid option");
    }
</script>
</body>
</html>
