<!DOCTYPE html>
<html>
<head>
    <title>1 to 10</title>
</head>
<body>
    <h2>print 1 to 10</h2> 
    <h2>Using for loop</h2>
    <script type="text/javascript"> // for loop
        for(var i = 1; i <= 10; i++) {
            document.write(i + "<br/>");
        }
    </script>
    <h2>Using while loop</h2>
    <script type="text/javascript"> // while loop
        var i = 1;
        while(i <= 10) {
            document.write(i + "<br/>");
            i++;
        }
    </script>
    <h2>Using do while loop</h2>
    <script type="text/javascript"> // do while loop
        var j = 1;
        do {
            document.write(j + "<br/>");
            j++;
        } while(j <= 10);
    </script>
    <h2> print 1 to 20 in reverse with decrement of 2</h2>
    <script type="text/javascript">
        for(var i = 20; i >= 1; i -= 2) {
            document.write(i + "<br/>");
        }
    </script>
    <script type="text/javascript">
        var k = 20;
        while(k >= 1) {
            document.write(k + "<br/>");
            k -= 2;
        }
    </script>
    <h2>print 1 to 100 in multiples of 5</h2>
    <script type="text/javascript">
        for(var i = 5; i <= 100; i += 5) {
            document.write(i + "<br/>");
        }
    </script>
    
</body>
</html>
