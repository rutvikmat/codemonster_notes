<!DOCTYPE html>
<html>
<head>
    <title>Reverse String</title>
</head>
<body>
    <h2>Reverse the input string</h2>
    <script type="text/javascript">
        var io = prompt("Enter a string to reverse:");
        var rev = "";
        for(var i = io.length - 1; i >= 0; i--) {
            rev += io[i];
        }
        document.write("Reversed String: " + rev);
    </script>
</body>
</html>
