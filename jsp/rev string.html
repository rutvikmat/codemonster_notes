<!DOCTYPE html>
<html>
<head>
    <title>Vowel Checker</title>
</head>
<body>
        <script type="text/javascript">
 
  var num = prompt("Enter a number:");
      var rev = 0;
 var temp=0;
       while (num > 0) {
  temp=rev*10;
         rev = temp + (num % 10);
         num = Math.floor(num / 10);
     }

      alert("Reversed number = " + rev);
   
     </script>
</body>
</html>
