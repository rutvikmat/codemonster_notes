<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Set Objects</h2>
<p>Using set collection </p>

<p id="demo"></p>

<script>
// Create a Map
const fruits = new Set();

// Set Map Values
fruits.add("apples");
fruits.add("bananas");
fruits.add("oranges");

document.getElementById("demo").innerHTML =fruits
//fruits.delete('apples');
</script>

</body>
</html>
