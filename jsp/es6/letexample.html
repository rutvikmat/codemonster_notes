<!DOCTYPE html>
<html>
<body>

<h2>Redeclaring a Variable Using let</h2>

<p id="demo"></p>	

<script>
var  x = 10;

// Here x is 10
console.log("first x"+x);
{  
  let x = 2;
const y=100;

//y=34;
console.log("y value is "+y);
console.log("second x"+x);
  // Here x is 2
}

// Here x is 10
document.getElementById("demo").innerHTML = x;
console.log("third x"+x);
</script>

</body>
</html>
