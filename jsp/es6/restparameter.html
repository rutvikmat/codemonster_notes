<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Function Rest Parameter</h2>

<p>The rest parameter (...) allows a function to treat an indefinite number of arguments as an array:</p>

<p id="demo"></p>

<script>
function sum(...args)//arrays
 {
  let sum = 0;
  for (let arg of args) sum += arg;
  return sum;
}

let x = sum(4, 9, 16, 25, 29, 100, 66, 77);
let x1=sum(6,5,2,1);
let x3=sum(12,23);

document.getElementById("demo").innerHTML = x3;
</script>

</body>
</html>
