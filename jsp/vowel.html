<!DOCTYPE html>
<html>
<head>
    <title>Vowel</title>
</head>
<body>
    <h2>Vowel </h2>
    <script type="text/javascript">
        var char = prompt("Enter a character:").toLowerCase();
        switch(char) {
            case 'a':
            case 'e':
            case 'i':
            case 'o':
            case 'u':
                alert(char + " is a vowel.");
                break;
            default:
                alert(char + " is not a vowel.");
        }
    </script>
</body>
</html>
