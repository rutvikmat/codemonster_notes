<!Doctype html>
<html>
<head>
    <title>Number Pattern</title>
</head>
<body>

<script type="text/javascript">
    let n = 5; // highest number in the first row

    for (let i = n; i >= 1; i--) {   // i = number of elements in the row
        for (let j = 1; j <= i; j++) {
            document.write(j);       // print numbers from 1 to i
        }
        document.write("<br>");      // new line after each row
    }
</script>

</body>
</html>
