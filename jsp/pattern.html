<!DOCTYPE html>
<html>
<head>
    <title>Pattern pgm</title>
</head>
<body>  
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h2 {
            color: rgb(144, 139, 39);
        }
    </style>
<h2>Pattern of Numbers </h2>
    <script type="text/javascript"> 
        for(var i = 1; i <= 5; i++) {
            for(var j = 1; j <= 5; j++) {
                document.write(j);
            }
            document.write("<br/>");
        }
    </script>
    <h2>Pattern of numbers right angles triangle</h2>
    <script type="text/javascript"> 
        for(var i = 1; i <= 5; i++) {
            for(var j = 1; j <= i; j++) {
                document.write(j);
            }
            document.write("<br/>");
        }
    </script>
    <h2> pattern of numbers in reverse right angles triangle</h2>
    <script type="text/javascript"> 
        for(var i = 5; i >= 1; i--) {
            for(var j = 1; j <= i; j++) {
                document.write(j);
            }
            document.write("<br/>");
        }
    </script>  
    <h2> Pattern of numbers pyramid</h2>
    <script type="text/javascript"> 
        for(var i = 1; i <= 5; i++) {
            for(var j = 1; j <= i; j++) {
                document.write(j);
            }
            document.write("<br/>");
        }
        for(var i = 4; i >= 1; i--) {
            for(var j = 1; j <= i; j++) {
                document.write(j);
            }
            document.write("<br/>");
        }
    </script>
</body>
</html>
