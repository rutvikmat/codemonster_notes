<!DOCTYPE html>
<html>
<head>
    <title>Loops in JavaScript</title>
</head>
<body>
    <h2>print 1 to 10</h2> 
    <h2>Using for loop</h2>
    <script type="text/javascript"> 
        for(var i = 1; i <= 10; i++) {
            document.write(i + "<br/>");
        }
    </script>
    <h2>Using while loop</h2>
    <script type="text/javascript"> 
        var i = 1;
        while(i <= 10) {
            document.write(i + "<br/>");
            i++;
        }
    </script>
    <h2>Using do while loop</h2>
    <script type="text/javascript"> 
        var j = 1;
        do {
            document.write(j + "<br/>");
            j++;
        } while(j <= 10);
    </script>
</body>
</html>
